<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-label="Actors Index entertainment directory illustration">
  <rect width="1200" height="700" fill="#F6F7FB"/>
  <rect width="1200" height="48" fill="#FFFFFF"/>
  <circle cx="32" cy="24" r="8" fill="#E7E9F2"/><circle cx="58" cy="24" r="8" fill="#E7E9F2"/><circle cx="84" cy="24" r="8" fill="#4F46E5"/>
  <rect x="120" y="16" width="300" height="16" rx="8" fill="#EEF2FF"/>
  <!-- header + search -->
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="60" y="110" font-size="26" font-weight="bold" fill="#0B1220">Find what&apos;s hot in screen entertainment</text>
    <text x="60" y="138" font-size="16" fill="#64748B">Movies · TV Shows · Celebrities · Jobs · Services</text>
    <rect x="60" y="160" width="760" height="52" rx="26" fill="#FFFFFF"/>
    <rect x="60" y="160" width="760" height="52" rx="26" fill="none" stroke="#E7E9F2" stroke-width="2"/>
    <text x="84" y="193" font-size="17" fill="#94A3B8">Search titles, talent, jobs…</text>
    <rect x="700" y="170" width="110" height="32" rx="16" fill="#4F46E5"/>
    <text x="755" y="191" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Search</text>
    <text x="860" y="193" font-size="15" font-weight="bold" fill="#4F46E5">Advanced Search</text>
  </g>
  <!-- genre filter chips -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold">
    <rect x="60" y="232" width="92" height="32" rx="16" fill="#4F46E5"/><text x="106" y="253" fill="#FFFFFF" text-anchor="middle">Action</text>
    <rect x="164" y="232" width="92" height="32" rx="16" fill="#FFFFFF"/><text x="210" y="253" fill="#0B1220" text-anchor="middle">Comedy</text>
    <rect x="268" y="232" width="92" height="32" rx="16" fill="#FFFFFF"/><text x="314" y="253" fill="#0B1220" text-anchor="middle">Drama</text>
    <rect x="372" y="232" width="92" height="32" rx="16" fill="#FFFFFF"/><text x="418" y="253" fill="#0B1220" text-anchor="middle">Horror</text>
    <rect x="476" y="232" width="110" height="32" rx="16" fill="#FFFFFF"/><text x="531" y="253" fill="#0B1220" text-anchor="middle">Sci-Fi</text>
  </g>
  <!-- hero carousel card with trailer button -->
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="60" y="288" width="520" height="300" rx="20" fill="#0B1220"/>
    <rect x="60" y="288" width="520" height="300" rx="20" fill="#0B1220"/>
    <circle cx="320" cy="408" r="44" fill="#FFFFFF"/>
    <path d="M308 388 L344 408 L308 428 Z" fill="#4F46E5"/>
    <text x="84" y="520" font-size="20" font-weight="bold" fill="#FFFFFF">Trending Now</text>
    <text x="84" y="548" font-size="15" fill="#CBD5E1">Top 10 Trending · Watch Trailer · Up Next</text>
    <circle cx="520" cy="548" r="10" fill="#14B8A6"/>
  </g>
  <!-- title cards -->
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="612" y="288" width="252" height="300" rx="20" fill="#FFFFFF"/>
    <rect x="612" y="288" width="252" height="150" rx="20" fill="#EEF2FF"/>
    <circle cx="738" cy="363" r="30" fill="#FFFFFF"/>
    <path d="M730 348 L750 363 L730 378 Z" fill="#4F46E5"/>
    <text x="632" y="478" font-size="17" font-weight="bold" fill="#0B1220">Title One</text>
    <text x="632" y="504" font-size="14" fill="#64748B">Talent · Reviews · Trailer</text>
    <rect x="632" y="524" width="110" height="28" rx="14" fill="#EEF2FF"/>
    <text x="687" y="543" font-size="13" font-weight="bold" fill="#4F46E5" text-anchor="middle">Details</text>
    <rect x="892" y="288" width="252" height="300" rx="20" fill="#FFFFFF"/>
    <rect x="892" y="288" width="252" height="150" rx="20" fill="#EEF2FF"/>
    <circle cx="1018" cy="363" r="30" fill="#FFFFFF"/>
    <path d="M1010 348 L1030 363 L1010 378 Z" fill="#4F46E5"/>
    <text x="912" y="478" font-size="17" font-weight="bold" fill="#0B1220">Title Two</text>
    <text x="912" y="504" font-size="14" fill="#64748B">Seasons · Episodes · News</text>
    <rect x="912" y="524" width="110" height="28" rx="14" fill="#EEF2FF"/>
    <text x="967" y="543" font-size="13" font-weight="bold" fill="#4F46E5" text-anchor="middle">Details</text>
  </g>
  <!-- finder strip -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold">
    <rect x="60" y="612" width="1084" height="56" rx="16" fill="#FFFFFF"/>
    <text x="84" y="647" fill="#0B1220">Talent Finder</text>
    <text x="300" y="647" fill="#0B1220">Job Finder</text>
    <text x="500" y="647" fill="#0B1220">Service Finder</text>
    <text x="720" y="647" fill="#0B1220">Event Finder</text>
    <text x="940" y="647" fill="#4F46E5">List a Film / TV Show</text>
  </g>
