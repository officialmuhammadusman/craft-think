<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-label="Illustration of the four project phases, from assess to launch and support">
  <rect width="1200" height="700" fill="#F6F7FB"/>
  <path d="M80 360 H1120" stroke="#4F46E5" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 14"/>
  <circle cx="210" cy="360" r="10" fill="#14B8A6"/><circle cx="500" cy="360" r="10" fill="#14B8A6"/><circle cx="790" cy="360" r="10" fill="#14B8A6"/><circle cx="1020" cy="360" r="10" fill="#14B8A6"/>
  <g font-family="Arial, sans-serif">
    <g><rect x="110" y="140" width="200" height="180" rx="20" fill="#FFFFFF" stroke="#E7E9F2" stroke-width="2"/><circle cx="210" cy="210" r="30" fill="#EEF2FF"/><text x="210" y="220" text-anchor="middle" font-size="30" fill="#4F46E5">?</text><text x="210" y="270" text-anchor="middle" font-size="22" font-weight="bold" fill="#0B1220">Assess</text><text x="210" y="298" text-anchor="middle" font-size="16" fill="#475569">Learn the business</text></g>
    <g><rect x="400" y="140" width="200" height="180" rx="20" fill="#FFFFFF" stroke="#E7E9F2" stroke-width="2"/><rect x="440" y="185" width="120" height="60" rx="10" fill="#EEF2FF"/><rect x="452" y="200" width="96" height="10" rx="5" fill="#4F46E5"/><rect x="452" y="220" width="64" height="10" rx="5" fill="#C7D2FE"/><text x="500" y="270" text-anchor="middle" font-size="22" font-weight="bold" fill="#0B1220">Prototype</text><text x="500" y="298" text-anchor="middle" font-size="16" fill="#475569">Approve the design</text></g>
    <g><rect x="690" y="140" width="200" height="180" rx="20" fill="#0B1220"/><rect x="720" y="185" width="140" height="14" rx="7" fill="#4F46E5"/><rect x="720" y="210" width="100" height="14" rx="7" fill="#FFFFFF" opacity="0.7"/><rect x="720" y="235" width="120" height="14" rx="7" fill="#FFFFFF" opacity="0.4"/><text x="790" y="270" text-anchor="middle" font-size="22" font-weight="bold" fill="#FFFFFF">Build</text><text x="790" y="298" text-anchor="middle" font-size="16" fill="#FFFFFF" opacity="0.7">Weekly demos</text></g>
    <g><rect x="920" y="140" width="200" height="180" rx="20" fill="#4F46E5"/><circle cx="1020" cy="205" r="26" fill="#FFFFFF"/><path d="M1008 205 L1017 214 L1034 196" stroke="#14B8A6" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="1020" y="270" text-anchor="middle" font-size="22" font-weight="bold" fill="#FFFFFF">Launch</text><text x="1020" y="298" text-anchor="middle" font-size="16" fill="#FFFFFF" opacity="0.85">Live checks done</text></g>
  </g>
  <g font-family="Arial, sans-serif">
    <rect x="340" y="440" width="520" height="120" rx="20" fill="#FFFFFF" stroke="#E7E9F2" stroke-width="2"/>
    <text x="600" y="490" text-anchor="middle" font-size="22" font-weight="bold" fill="#0B1220">Each phase ends with something you approve</text>
    <text x="600" y="525" text-anchor="middle" font-size="18" fill="#475569">Or you can stop at any phase — no surprises</text>
  </g>
</svg>
