<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-label="Padel court booking interface illustration">
  <rect width="1200" height="700" fill="#F6F7FB"/>
  <rect width="1200" height="48" fill="#FFFFFF"/>
  <circle cx="32" cy="24" r="8" fill="#E7E9F2"/><circle cx="58" cy="24" r="8" fill="#E7E9F2"/><circle cx="84" cy="24" r="8" fill="#4F46E5"/>
  <rect x="120" y="16" width="300" height="16" rx="8" fill="#EEF2FF"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="60" y="110" font-size="24" font-weight="bold" fill="#0B1220">Book a court</text>
    <text x="60" y="138" font-size="16" fill="#64748B">Pick a court, a time, and players at your level.</text>
  </g>
  <!-- court cards -->
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="60" y="160" width="540" height="200" rx="20" fill="#FFFFFF"/>
    <rect x="84" y="184" width="180" height="110" rx="12" fill="#EEF2FF"/>
    <rect x="84" y="184" width="180" height="110" rx="12" fill="none" stroke="#4F46E5" stroke-width="3"/>
    <line x1="174" y1="184" x2="174" y2="294" stroke="#4F46E5" stroke-width="3"/>
    <circle cx="129" cy="239" r="12" fill="#14B8A6"/><circle cx="219" cy="239" r="12" fill="#14B8A6"/>
    <text x="284" y="212" font-size="19" font-weight="bold" fill="#0B1220">Court 1 — Indoor</text>
    <text x="284" y="240" font-size="15" fill="#64748B">Evening slots open</text>
    <rect x="284" y="258" width="130" height="32" rx="16" fill="#4F46E5"/>
    <text x="349" y="279" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Book now</text>
    <rect x="60" y="380" width="540" height="200" rx="20" fill="#FFFFFF"/>
    <rect x="84" y="404" width="180" height="110" rx="12" fill="#EEF2FF"/>
    <line x1="174" y1="404" x2="174" y2="514" stroke="#4F46E5" stroke-width="3"/>
    <circle cx="129" cy="459" r="12" fill="#94A3B8"/><circle cx="219" cy="459" r="12" fill="#94A3B8"/>
    <text x="284" y="432" font-size="19" font-weight="bold" fill="#0B1220">Court 2 — Outdoor</text>
    <text x="284" y="460" font-size="15" fill="#64748B">Morning slots open</text>
    <rect x="284" y="478" width="130" height="32" rx="16" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2"/>
    <text x="349" y="499" font-size="14" font-weight="bold" fill="#4F46E5" text-anchor="middle">Book now</text>
  </g>
  <!-- matchmaking panel -->
  <rect x="632" y="160" width="508" height="420" rx="20" fill="#0B1220"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="664" y="208" font-size="20" font-weight="bold" fill="#FFFFFF">Find a fair match</text>
    <rect x="664" y="232" width="444" height="76" rx="14" fill="#1E293B"/>
    <text x="688" y="264" font-size="16" font-weight="bold" fill="#FFFFFF">Match by skill level</text>
    <text x="688" y="288" font-size="14" fill="#94A3B8">Players paired by tier and history</text>
    <rect x="664" y="324" width="444" height="76" rx="14" fill="#1E293B"/>
    <text x="688" y="356" font-size="16" font-weight="bold" fill="#FFFFFF">Membership billing</text>
    <text x="688" y="380" font-size="14" fill="#94A3B8">Paid automatically, no chasing</text>
    <rect x="664" y="416" width="444" height="76" rx="14" fill="#4F46E5"/>
    <text x="688" y="448" font-size="16" font-weight="bold" fill="#FFFFFF">Join a match</text>
    <text x="688" y="472" font-size="14" fill="#C7D2FE">Approve or decline in one tap</text>
    <circle cx="676" cy="532" r="6" fill="#14B8A6"/>
    <text x="694" y="538" font-size="15" fill="#FFFFFF">Club dashboard and player app, in sync</text>
  </g>
  <rect x="60" y="600" width="1080" height="52" rx="26" fill="#FFFFFF"/>
  <text x="600" y="633" font-size="16" fill="#475569" text-anchor="middle">Courts, matches and memberships — managed in one place.</text>
</svg>
