<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-label="Illustration of the three ways to work with CraftThink: fixed project, dedicated team, and support and care">
  <rect width="1200" height="700" fill="#F6F7FB"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g><rect x="70" y="150" width="320" height="340" rx="20" fill="#FFFFFF" stroke="#E7E9F2" stroke-width="2"/><rect x="70" y="150" width="320" height="12" rx="6" fill="#4F46E5"/><text x="230" y="230" font-size="24" font-weight="bold" fill="#0B1220">Fixed Project</text><text x="230" y="265" font-size="17" fill="#475569">One defined product</text><text x="230" y="292" font-size="17" fill="#475569">One agreed price</text><rect x="110" y="330" width="240" height="48" rx="24" fill="#4F46E5"/><text x="230" y="361" font-size="18" font-weight="bold" fill="#FFFFFF">Get an estimate</text></g>
    <g><rect x="440" y="150" width="320" height="340" rx="20" fill="#0B1220"/><text x="600" y="230" font-size="24" font-weight="bold" fill="#FFFFFF">Dedicated Team</text><text x="600" y="265" font-size="17" fill="#FFFFFF" opacity="0.75">Ongoing product work</text><text x="600" y="292" font-size="17" fill="#FFFFFF" opacity="0.75">Month to month</text><rect x="480" y="330" width="240" height="48" rx="24" fill="#FFFFFF"/><text x="600" y="361" font-size="18" font-weight="bold" fill="#4F46E5">Book a consultation</text></g>
    <g><rect x="810" y="150" width="320" height="340" rx="20" fill="#FFFFFF" stroke="#E7E9F2" stroke-width="2"/><circle cx="970" cy="215" r="10" fill="#14B8A6"/><circle cx="970" cy="250" r="10" fill="#14B8A6"/><circle cx="970" cy="285" r="10" fill="#14B8A6"/><text x="970" y="230" font-size="24" font-weight="bold" fill="#0B1220" text-anchor="middle">Support &amp; Care</text><text x="970" y="360" font-size="17" fill="#475569">Kept healthy, cancel anytime</text><rect x="850" y="390" width="240" height="48" rx="24" fill="#EEF2FF"/><text x="970" y="421" font-size="18" font-weight="bold" fill="#4F46E5">See support</text></g>
  </g>
  <text x="600" y="600" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#475569">All three include weekly demos</text>
</svg>
