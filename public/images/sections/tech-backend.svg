<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-label="Illustration of backend development: servers and APIs">
  <rect width="1200" height="700" fill="#F6F7FB"/>
  <g font-family="Arial, sans-serif">
    <rect x="200" y="120" width="320" height="460" rx="24" fill="#0B1220"/>
    <rect x="240" y="170" width="240" height="24" rx="12" fill="#4F46E5"/>
    <rect x="240" y="220" width="240" height="24" rx="12" fill="#FFFFFF" opacity="0.3"/>
    <rect x="240" y="270" width="180" height="24" rx="12" fill="#FFFFFF" opacity="0.3"/>
    <circle cx="460" cy="360" r="12" fill="#14B8A6"/>
    <rect x="240" y="420" width="240" height="24" rx="12" fill="#FFFFFF" opacity="0.3"/>
    <rect x="240" y="470" width="200" height="24" rx="12" fill="#FFFFFF" opacity="0.3"/>
    <g text-anchor="middle">
      <rect x="620" y="180" width="380" height="110" rx="16" fill="#FFFFFF" stroke="#E7E9F2" stroke-width="2"/>
      <text x="810" y="230" font-size="22" font-weight="bold" fill="#0B1220">API request</text>
      <text x="810" y="262" font-size="17" fill="#475569">Checked, then answered</text>
      <rect x="620" y="330" width="380" height="110" rx="16" fill="#4F46E5"/>
      <text x="810" y="380" font-size="22" font-weight="bold" fill="#FFFFFF">Secure response</text>
      <text x="810" y="412" font-size="17" fill="#FFFFFF" opacity="0.85">Signed in, permission checked</text>
    </g>
    <path d="M520 350 H620" stroke="#4F46E5" stroke-width="4" stroke-dasharray="2 12"/>
    <text x="600" y="640" text-anchor="middle" font-size="24" font-weight="bold" fill="#0B1220">Backend — safe, reliable logic</text>
  </g>
</svg>
