<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-label="Illustration of direct contact with the project lead: one conversation, no ticket queue">
  <rect width="1200" height="700" fill="#F6F7FB"/>
  <g font-family="Arial, sans-serif">
    <rect x="150" y="140" width="480" height="300" rx="20" fill="#FFFFFF" stroke="#E7E9F2" stroke-width="2"/>
    <rect x="190" y="185" width="400" height="56" rx="28" fill="#EEF2FF"/>
    <text x="390" y="222" text-anchor="middle" font-size="19" fill="#0B1220">Tell us the problem, once</text>
    <rect x="190" y="265" width="400" height="56" rx="28" fill="#4F46E5"/>
    <text x="390" y="302" text-anchor="middle" font-size="19" font-weight="bold" fill="#FFFFFF">Talk to the project lead</text>
    <rect x="190" y="345" width="400" height="56" rx="28" fill="#EEF2FF"/>
    <text x="390" y="382" text-anchor="middle" font-size="19" fill="#0B1220">Same person, throughout</text>
    <g text-anchor="middle">
      <rect x="700" y="140" width="350" height="300" rx="20" fill="#0B1220"/>
      <circle cx="875" cy="240" r="44" fill="#4F46E5"/>
      <text x="875" y="252" font-size="30" font-weight="bold" fill="#FFFFFF">CE</text>
      <text x="875" y="330" font-size="22" font-weight="bold" fill="#FFFFFF">CEO &amp; Founder</text>
      <text x="875" y="362" font-size="17" fill="#FFFFFF" opacity="0.75">Leads your project directly</text>
    </g>
    <text x="600" y="540" text-anchor="middle" font-size="24" font-weight="bold" fill="#0B1220">No account manager in between</text>
  </g>
</svg>
