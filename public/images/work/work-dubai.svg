<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-label="Dubai tours booking interface illustration">
  <rect width="1200" height="700" fill="#F6F7FB"/>
  <rect width="1200" height="48" fill="#FFFFFF"/>
  <circle cx="32" cy="24" r="8" fill="#E7E9F2"/><circle cx="58" cy="24" r="8" fill="#E7E9F2"/><circle cx="84" cy="24" r="8" fill="#4F46E5"/>
  <rect x="120" y="16" width="300" height="16" rx="8" fill="#EEF2FF"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="60" y="110" font-size="26" font-weight="bold" fill="#0B1220">Dubai tours, booked in minutes</text>
    <text x="60" y="138" font-size="16" fill="#64748B">23 experiences · Hotel pickup · Pay on pickup</text>
  </g>
  <!-- tour cards with flat desert scene -->
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="60" y="160" width="350" height="260" rx="20" fill="#FFFFFF"/>
    <rect x="60" y="160" width="350" height="130" rx="20" fill="#FEF3C7"/>
    <circle cx="340" cy="200" r="26" fill="#F59E0B"/>
    <path d="M60 290 Q150 230 230 270 Q320 305 410 260 L410 290 Z" fill="#D97706"/>
    <text x="84" y="330" font-size="19" font-weight="bold" fill="#0B1220">Desert Safari</text>
    <text x="84" y="356" font-size="15" fill="#64748B">Dunes, dinner and shows</text>
    <rect x="84" y="372" width="150" height="30" rx="15" fill="#DCFCE7"/>
    <text x="159" y="392" font-size="13" font-weight="bold" fill="#166534" text-anchor="middle">Pay on pickup</text>
    <rect x="60" y="440" width="350" height="200" rx="20" fill="#FFFFFF"/>
    <rect x="60" y="440" width="350" height="100" rx="20" fill="#EEF2FF"/>
    <rect x="200" y="470" width="70" height="40" rx="10" fill="#4F46E5"/>
    <circle cx="160" cy="505" r="14" fill="#0B1220"/><circle cx="240" cy="505" r="14" fill="#0B1220"/>
    <text x="84" y="580" font-size="19" font-weight="bold" fill="#0B1220">Buggy / ATV Adventure</text>
    <text x="84" y="606" font-size="15" fill="#64748B">Drive the red dunes yourself</text>
  </g>
  <!-- booking panel -->
  <rect x="442" y="160" width="698" height="480" rx="20" fill="#0B1220"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="474" y="208" font-size="20" font-weight="bold" fill="#FFFFFF">Your booking</text>
    <rect x="474" y="232" width="634" height="64" rx="14" fill="#1E293B"/>
    <text x="498" y="258" font-size="16" fill="#94A3B8">Tour</text>
    <text x="498" y="282" font-size="17" fill="#FFFFFF">Desert Safari — evening</text>
    <rect x="474" y="312" width="304" height="64" rx="14" fill="#1E293B"/>
    <text x="498" y="338" font-size="16" fill="#94A3B8">Pickup hotel</text>
    <text x="498" y="362" font-size="17" fill="#FFFFFF">Any hotel in Dubai</text>
    <rect x="804" y="312" width="304" height="64" rx="14" fill="#1E293B"/>
    <text x="828" y="338" font-size="16" fill="#94A3B8">Guests</text>
    <text x="828" y="362" font-size="17" fill="#FFFFFF">Choose your party size</text>
    <rect x="474" y="392" width="634" height="64" rx="14" fill="#1E293B"/>
    <text x="498" y="418" font-size="16" fill="#94A3B8">Cancellation</text>
    <text x="498" y="442" font-size="17" fill="#FFFFFF">Free up to a few hours before</text>
    <rect x="474" y="476" width="634" height="64" rx="32" fill="#16A34A"/>
    <text x="791" y="515" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Confirm on WhatsApp →</text>
    <text x="474" y="580" font-size="15" fill="#94A3B8">No advance deposit. Confirmation arrives instantly.</text>
  </g>
