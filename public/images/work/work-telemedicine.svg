<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-label="Telemedicine booking interface illustration">
  <rect width="1200" height="700" fill="#F6F7FB"/>
  <rect width="1200" height="48" fill="#FFFFFF"/>
  <circle cx="32" cy="24" r="8" fill="#E7E9F2"/><circle cx="58" cy="24" r="8" fill="#E7E9F2"/><circle cx="84" cy="24" r="8" fill="#4F46E5"/>
  <rect x="120" y="16" width="300" height="16" rx="8" fill="#EEF2FF"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="60" y="76" width="660" height="200" rx="24" fill="#FFFFFF"/>
    <circle cx="120" cy="150" r="40" fill="#EEF2FF"/><text x="120" y="160" font-size="30" text-anchor="middle" fill="#4F46E5">Dr</text>
    <text x="184" y="132" font-size="22" font-weight="bold" fill="#0B1220">Chronic pain specialist</text>
    <text x="184" y="162" font-size="16" fill="#64748B">Video consultation · Remote care</text>
    <rect x="184" y="184" width="170" height="32" rx="16" fill="#DCFCE7"/>
    <text x="269" y="205" font-size="14" font-weight="bold" fill="#166534" text-anchor="middle">● Available</text>
    <rect x="60" y="300" width="660" height="324" rx="24" fill="#FFFFFF"/>
    <text x="88" y="342" font-size="20" font-weight="bold" fill="#0B1220">Choose a time slot</text>
    <rect x="88" y="366" width="140" height="52" rx="12" fill="#EEF2FF"/><text x="158" y="399" font-size="17" text-anchor="middle" fill="#0B1220">Morning</text>
    <rect x="244" y="366" width="140" height="52" rx="12" fill="#4F46E5"/><text x="314" y="399" font-size="17" font-weight="bold" text-anchor="middle" fill="#FFFFFF">Afternoon</text>
    <rect x="400" y="366" width="140" height="52" rx="12" fill="#EEF2FF"/><text x="470" y="399" font-size="17" text-anchor="middle" fill="#0B1220">Evening</text>
    <rect x="88" y="442" width="292" height="56" rx="12" fill="#FFFFFF" stroke="#E7E9F2" stroke-width="2"/><text x="234" y="478" font-size="16" text-anchor="middle" fill="#64748B">Slot reserved for you</text>
    <rect x="396" y="442" width="292" height="56" rx="12" fill="#FFFFFF" stroke="#E7E9F2" stroke-width="2"/><text x="542" y="478" font-size="16" text-anchor="middle" fill="#64748B">Slot reserved for you</text>
    <rect x="88" y="522" width="600" height="56" rx="28" fill="#4F46E5"/>
    <text x="388" y="558" font-size="18" font-weight="bold" text-anchor="middle" fill="#FFFFFF">Confirm booking →</text>
  </g>
  <rect x="752" y="76" width="388" height="548" rx="24" fill="#0B1220"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="784" y="124" font-size="20" font-weight="bold" fill="#FFFFFF">Before your visit</text>
    <rect x="784" y="148" width="324" height="72" rx="14" fill="#1E293B"/>
    <text x="806" y="178" font-size="16" fill="#FFFFFF">Lab report uploaded</text>
    <text x="806" y="202" font-size="14" fill="#94A3B8">Reviewed by the specialist</text>
    <rect x="784" y="236" width="324" height="72" rx="14" fill="#1E293B"/>
    <text x="806" y="266" font-size="16" fill="#FFFFFF">Imaging uploaded</text>
    <text x="806" y="290" font-size="14" fill="#94A3B8">Reviewed by the specialist</text>
    <rect x="784" y="324" width="324" height="72" rx="14" fill="#1E293B"/>
    <text x="806" y="354" font-size="16" fill="#FFFFFF">Payment verified</text>
    <text x="806" y="378" font-size="14" fill="#94A3B8">Booking confirmed</text>
    <rect x="784" y="424" width="324" height="120" rx="14" fill="#4F46E5"/>
    <text x="806" y="458" font-size="16" font-weight="bold" fill="#FFFFFF">Video link sent by email</text>
    <text x="806" y="484" font-size="14" fill="#C7D2FE">after payment is verified.</text>
    <text x="806" y="508" font-size="14" fill="#C7D2FE">The specialist sees your history</text>
    <text x="806" y="528" font-size="14" fill="#C7D2FE">before the call starts.</text>
  </g>
</svg>
