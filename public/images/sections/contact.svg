<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-label="Illustration of contacting CraftThink by email or WhatsApp">
  <rect width="1200" height="700" fill="#F6F7FB"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g><rect x="150" y="180" width="400" height="300" rx="20" fill="#FFFFFF" stroke="#E7E9F2" stroke-width="2"/><rect x="190" y="220" width="320" height="60" rx="12" fill="#EEF2FF"/><text x="350" y="258" font-size="20" font-weight="bold" fill="#4F46E5">Email us</text><rect x="190" y="300" width="320" height="20" rx="10" fill="#E7E9F2"/><rect x="190" y="335" width="220" height="20" rx="10" fill="#E7E9F2"/><text x="350" y="420" font-size="18" fill="#475569">We reply by email</text></g>
    <g><rect x="650" y="180" width="400" height="300" rx="20" fill="#4F46E5"/><circle cx="850" cy="280" r="44" fill="#FFFFFF"/><text x="850" y="292" font-size="30" fill="#4F46E5">✆</text><text x="850" y="380" font-size="22" font-weight="bold" fill="#FFFFFF">WhatsApp us</text><text x="850" y="412" font-size="18" fill="#FFFFFF" opacity="0.85">A faster way to reach us</text></g>
    <text x="600" y="580" font-size="24" font-weight="bold" fill="#0B1220">No pressure — just a conversation</text>
  </g>
</svg>
