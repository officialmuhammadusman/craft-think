<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-label="Illustration of the journey after contacting CraftThink, from request to support">
  <rect width="1200" height="700" fill="#F6F7FB"/>
  <path d="M60 350 H1140" stroke="#4F46E5" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 14"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g><circle cx="130" cy="350" r="52" fill="#FFFFFF" stroke="#E7E9F2" stroke-width="2"/><text x="130" y="362" font-size="30" fill="#4F46E5">✉</text><text x="130" y="450" font-size="20" font-weight="bold" fill="#0B1220">Request</text><text x="130" y="478" font-size="16" fill="#475569">You tell us the problem</text></g>
    <g><circle cx="330" cy="350" r="52" fill="#FFFFFF" stroke="#E7E9F2" stroke-width="2"/><text x="330" y="362" font-size="30" fill="#4F46E5">☎</text><text x="330" y="450" font-size="20" font-weight="bold" fill="#0B1220">Free call</text><text x="330" y="478" font-size="16" fill="#475569">Talk to the project lead</text></g>
    <g><circle cx="530" cy="350" r="52" fill="#4F46E5"/><text x="530" y="362" font-size="30" fill="#FFFFFF">✓</text><text x="530" y="450" font-size="20" font-weight="bold" fill="#0B1220">Written plan</text><text x="530" y="478" font-size="16" fill="#475569">Scope and price, in writing</text></g>
    <g><circle cx="730" cy="350" r="52" fill="#FFFFFF" stroke="#E7E9F2" stroke-width="2"/><text x="730" y="362" font-size="30" fill="#4F46E5">▣</text><text x="730" y="450" font-size="20" font-weight="bold" fill="#0B1220">Build safely</text><text x="730" y="478" font-size="16" fill="#475569">Small tested steps</text></g>
    <g><circle cx="930" cy="350" r="52" fill="#0B1220"/><text x="930" y="362" font-size="30" fill="#FFFFFF">▲</text><text x="930" y="450" font-size="20" font-weight="bold" fill="#0B1220">Launch</text><text x="930" y="478" font-size="16" fill="#475569">Checked live with you</text></g>
    <g><circle cx="1100" cy="350" r="52" fill="#FFFFFF" stroke="#E7E9F2" stroke-width="2"/><circle cx="1100" cy="350" r="10" fill="#14B8A6"/><text x="1100" y="450" font-size="20" font-weight="bold" fill="#0B1220">Support</text><text x="1100" y="478" font-size="16" fill="#475569">After launch, too</text></g>
  </g>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="600" y="130" font-size="30" font-weight="bold" fill="#0B1220">No obligation at any step</text>
    <text x="600" y="168" font-size="20" fill="#475569">You decide from a written plan — before you pay anything</text>
  </g>
</svg>
