<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-label="Illustration of a CRM: customers, conversations, and follow-ups in one place">
  <rect width="1200" height="700" fill="#F6F7FB"/>
  <g font-family="Arial, sans-serif">
    <rect x="120" y="130" width="960" height="440" rx="24" fill="#FFFFFF" stroke="#E7E9F2" stroke-width="2"/>
    <rect x="120" y="130" width="960" height="64" rx="24" fill="#0B1220"/>
    <text x="600" y="172" text-anchor="middle" font-size="22" font-weight="bold" fill="#FFFFFF">One place for every customer</text>
    <g text-anchor="middle">
      <rect x="170" y="240" width="260" height="140" rx="14" fill="#EEF2FF"/><text x="300" y="300" font-size="20" font-weight="bold" fill="#0B1220">Customers</text><text x="300" y="332" font-size="16" fill="#475569">Who they are</text>
      <rect x="470" y="240" width="260" height="140" rx="14" fill="#EEF2FF"/><text x="600" y="300" font-size="20" font-weight="bold" fill="#0B1220">Conversations</text><text x="600" y="332" font-size="16" fill="#475569">What was said</text>
      <rect x="770" y="240" width="260" height="140" rx="14" fill="#4F46E5"/><text x="900" y="300" font-size="20" font-weight="bold" fill="#FFFFFF">Follow-ups</text><text x="900" y="332" font-size="16" fill="#FFFFFF" opacity="0.85">Nothing forgotten</text>
    </g>
    <rect x="170" y="420" width="860" height="90" rx="14" fill="#F6F7FB"/>
    <text x="600" y="475" text-anchor="middle" font-size="20" font-weight="bold" fill="#0B1220">Sales live together — not in scattered messages</text>
  </g>
</svg>
